name: Release

# Tag a commit to cut a release:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Produces a prebuilt `nh` for each platform, so installing the tool does not
# mean compiling the toolkit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read by default. The build and extension jobs compile and package; only the
# publish job creates anything, and it raises its own permission. A workflow
# that writes has to say where it writes.
permissions:
  contents: read

# Third-party actions are pinned to a commit rather than a tag, for the reason
# given at the top of ci.yml.
jobs:
  build:
    name: nh — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: aarch64-apple-darwin,      label: macos-arm64 }
          # Cross-compiled from the arm64 runner. `macos-13` is the last Intel
          # runner and GitHub is retiring it — a v0.1.0 build sat queued on it
          # for ten minutes while every other target finished. Apple's SDK
          # targets both architectures, so this needs nothing but the target.
          - { os: macos-latest,  target: x86_64-apple-darwin,       label: macos-x86_64, cross: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,  label: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   label: windows-x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p nh-cli --target ${{ matrix.target }}

      # A binary that cannot check a grammar is not worth shipping.
      # A cross-built binary does not run on the machine that built it.
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/nh"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" check example.nh --quiet

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="nh-${{ matrix.label }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/nh.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/nh" "dist/$name/"
          fi
          cp README.md USAGE.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nh-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies --allow-missing-repository
        working-directory: editors/vscode
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nh-vsix
          path: editors/vscode/*.vsix

  publish:
    name: Attach to the release
    needs: [build, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -R artifacts
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
