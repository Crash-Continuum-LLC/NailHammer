name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# CI reads the repository and writes nothing. Stated here rather than left to
# the repository default, because the default is a setting somebody can change
# without ever opening this file.
permissions:
  contents: read

# Third-party actions are pinned to a commit rather than a tag. A tag is a
# moving pointer the author can repoint at any time, which on a public
# repository means a supply chain that updates itself without review. The
# comment records which release the commit was, and Dependabot proposes the
# bumps as ordinary pull requests.
jobs:
  rust:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Standing constraint: generated code is read by the user's linter, and a
      # warning they cannot act on is a defect. `-D warnings` holds that line.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `Shared<T>` is `Rc` by default and `Arc` under `threadsafe`, so a
      # handler that spells `Rc` compiles by luck and breaks the moment anyone
      # turns the feature on. Every worked example named `Rc` directly until it
      # was checked -- the default build could never have caught it, because
      # the two are the same type there.
      - name: The examples survive a thread-safe build
        run: cargo build --workspace --all-targets --features nh-runtime/threadsafe

      # `nh init` scaffolds a project that must compile and run. These are
      # `#[ignore]`d locally because they invoke cargo recursively and are slow.
      - name: Scaffold end-to-end
        run: cargo test -p nh-cli -- --ignored

  grammars:
    name: every shipped grammar checks clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build the CLI
        run: cargo build -p nh-cli

      # A grammar that stops checking clean is a regression in the analyser,
      # the lowerer, or the grammar. Any of the three is worth failing for.
      - name: Check
        run: |
          set -euo pipefail
          for f in example.nh examples/*.nh examples/*/*.nh; do
            # common_lex.nh is a fragment with no `grammar` declaration, so it
            # is only meaningful when imported.
            [ "$(basename "$f")" = common_lex.nh ] && continue
            echo "--- $f"
            ./target/debug/nh check "$f" --quiet --deny-warnings
          done

      # The checked-in generated code must match what the current generator
      # produces, or the worked examples silently drift from the toolkit.
      - name: Generated output is current
        run: |
          set -euo pipefail
          for e in config calc-interp basic-interp bytecode pebble; do
            g=$(ls examples/$e/*.nh)
            ./target/debug/nh build "$g" \
              -o "examples/$e/src/$(basename "$g" .nh).pest" --rust "examples/$e/src"
          done
          # The VM twins additionally generate their operator implementation,
          # so they must be regenerated with the same --target their build.rs
          # uses or the check would compare against a file nobody wrote.
          for e in vm-c vm-basic; do
            ./target/debug/nh build "examples/$e/lang.nh" \
              -o "examples/$e/src/lang.pest" --rust "examples/$e/src" --target nh-vm
          done
          ./target/debug/nh build examples/selfhost/nh.nh -o examples/selfhost/nh.pest
          if ! git diff --quiet; then
            echo "::error::generated output is stale — re-run nh build and commit"
            git diff --stat
            exit 1
          fi

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      # Tokenises real `.nh` with the same engine VS Code uses, checks the
      # completion logic, verifies every grammar scope has a colour, then
      # type-checks against the real VS Code and Node APIs.
      - run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies --allow-missing-repository

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nailhammer-vsix
          path: editors/vscode/*.vsix
