[package]
name = "bc-compiler"
description = "Worked NailHammer bytecode compiler — the same handler shapes as an interpreter, with `type Out = ()`"
version = "0.1.0"
edition = "2021"

[lib]
name = "bc"
path = "src/lib.rs"

[[bin]]
name = "bc-compiler"
path = "src/main.rs"

[dependencies]
nh-runtime = { path = "../../crates/nh-runtime" }
pest = "2.8"
pest_derive = { version = "2.8", features = ["grammar-extras"] }
