[package]
name = "calc-interp"
description = "Worked NailHammer interpreter exercising the operator driver"
version = "0.1.0"
# Not published. These are worked examples that exist to be read and to be
# rebuilt by CI, and their path dependencies on the toolkit would have to become
# version dependencies for a registry to accept them at all. `publish = false`
# also means `cargo publish --workspace` cannot sweep them up by accident.
publish = false
edition = "2021"

[lib]
name = "calc_interp"
path = "src/lib.rs"

[[bin]]
name = "calc-interp"
path = "src/main.rs"

[dependencies]
nh-runtime = { path = "../../crates/nh-runtime" }
pest = "2.8"
pest_derive = { version = "2.8", features = ["grammar-extras"] }
