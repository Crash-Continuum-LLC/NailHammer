[package]
name = "nh-runtime"
description = "Runtime support for NailHammer-generated parsers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pest.workspace = true

[dev-dependencies]
# `grammar-extras` for the same reason it is required everywhere else: pest's
# own tag validation is gated behind it.
pest_meta = { version = "2.8", features = ["grammar-extras"] }
pest_vm = { version = "2.8", features = ["grammar-extras"] }
