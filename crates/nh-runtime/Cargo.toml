[package]
name = "nh-runtime"
description = "Runtime support for NailHammer-generated parsers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pest.workspace = true

[dev-dependencies]
# `grammar-extras` for the same reason it is required everywhere else: pest's
# own tag validation is gated behind it.
pest_meta = { version = "2.8", features = ["grammar-extras"] }
pest_vm = { version = "2.8", features = ["grammar-extras"] }

[features]
# `Arc` instead of `Rc` for the generated AST, so a program tree is `Send +
# Sync`. Off by default: a single-threaded interpreter should not pay for
# atomics it never needs. See `src/shared.rs` — flipping it changes no
# signatures, because the generated code and your handlers both say `Shared<T>`.
threadsafe = []
