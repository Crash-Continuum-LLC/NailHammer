[package]
name = "nh-cli"
description = "NailHammer command line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "nh"
path = "src/main.rs"

[dependencies]
nh-syntax.workspace = true
nh-operators.workspace = true
nh-lower.workspace = true

# Same feature requirement as nh-lower's tests: tag validation is itself gated
# behind `grammar-extras`, so without it these checks would pass grammars that
# `pest_derive` rejects — which is exactly the bug `nh init` exists to prevent.
pest.workspace = true
pest_meta = { version = "2.8", features = ["grammar-extras"] }
pest_vm = { version = "2.8", features = ["grammar-extras"] }

nh-codegen.workspace = true
nh-analysis.workspace = true

# `vendor` exposes the runtime's own source text, which `nh init` writes into
# each scaffolded project. This crate is the only thing that turns it on.
nh-runtime = { workspace = true, features = ["vendor"] }

[dev-dependencies]
